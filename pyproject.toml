[project]
name = "vidcat"
version = "0.1.0"
description = "Find duplicate home videos, fix poor filenames, catalog and tag them, and browse them in a web UI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "typer>=0.12",
    "rich>=13",
    "send2trash>=1.8",
    "httpx>=0.27",
]

[project.scripts]
vidcat = "vidcat.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vidcat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
